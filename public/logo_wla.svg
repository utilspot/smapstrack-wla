<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="Smaps Tracker">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0078d4" />
      <stop offset="1" stop-color="#005fb8" />
    </linearGradient>
  </defs>
  <rect width="320" height="200" rx="16" fill="url(#bg)" />

  <!-- The app's mark, as in favicon.svg, inverted onto white -->
  <g transform="translate(24 24) scale(0.75)">
    <rect width="64" height="64" rx="12" fill="#ffffff" />
    <g fill="none" stroke="#0078d4" stroke-linecap="round" stroke-linejoin="round" stroke-width="3.5">
      <rect x="16" y="14" width="32" height="36" rx="4" />
      <path d="M9 22h7M9 32h7M9 42h7M48 22h7M48 32h7M48 42h7" />
      <path d="M21.5 41l6-7 4.5 3.5 9-12" />
    </g>
    <circle cx="41" cy="25.5" r="3.5" fill="#0078d4" />
  </g>
  <text x="84" y="61" fill="#ffffff" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
    font-size="22" font-weight="700">Smaps Tracker</text>

  <!-- A process's memory over time, the way the tracker charts it -->
  <rect x="24" y="92" width="272" height="66" rx="8" fill="#ffffff" fill-opacity="0.12" />
  <g stroke="#ffffff" stroke-opacity="0.18" stroke-width="1">
    <path d="M36 108h214M36 125h214M36 142h214" />
  </g>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5">
    <path d="M36 112l30-2 30 1 30-5 30 1 30-6 30-3 34-3" stroke="#ffffff" />
    <path d="M36 126l30-1 30 1 30-4 30 1 30-5 30-2 34-3" stroke="#ffffff" stroke-opacity="0.7" />
    <path d="M36 146l30 0 30-1 30 1 30-1 30 0 30-1 34 0" stroke="#ffffff" stroke-opacity="0.45" />
  </g>
  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#ffffff">
    <text x="258" y="102">RSS</text>
    <text x="258" y="121" fill-opacity="0.8">PSS</text>
    <text x="258" y="149" fill-opacity="0.65">Swap</text>
  </g>
  <text x="24" y="180" fill="#ffffff" fill-opacity="0.85"
    font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13">Live per-component memory over SSH</text>
</svg>
